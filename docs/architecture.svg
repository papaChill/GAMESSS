<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Карта архитектуры игры</title>
  <desc id="description">Карта запуска приложения, модулей игры и автомата состояний.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="state-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
    <style>
      .background { fill: #f1f5f9; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .heading { fill: #0f172a; font: 700 28px system-ui, sans-serif; }
      .section { fill: #0f172a; font: 700 18px system-ui, sans-serif; }
      .node-title { fill: #0f172a; font: 700 16px system-ui, sans-serif; }
      .node-copy { fill: #334155; font: 14px system-ui, sans-serif; }
      .caption { fill: #475569; font: 14px system-ui, sans-serif; }
      .node { stroke-width: 2; rx: 14; }
      .entry { fill: #dbeafe; stroke: #60a5fa; }
      .config { fill: #fce7f3; stroke: #f472b6; }
      .scene { fill: #ede9fe; stroke: #a78bfa; }
      .state { fill: #fef3c7; stroke: #f59e0b; }
      .system { fill: #dcfce7; stroke: #4ade80; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .state-arrow { fill: none; stroke: #b45309; stroke-width: 2.5; marker-end: url(#state-arrow); }
      .trunk { fill: none; stroke: #94a3b8; stroke-width: 2.4; }
    </style>
  </defs>

  <rect class="background" width="1200" height="1080"/>
  <text class="heading" x="56" y="58">Карта архитектуры игры</text>
  <text class="caption" x="56" y="87">От запуска приложения к игровым системам; ниже — основные состояния игры.</text>

  <rect class="panel" x="36" y="112" width="1128" height="620" rx="22"/>
  <text class="section" x="68" y="153">1. Запуск и ответственность модулей</text>

  <rect class="node entry" x="458" y="180" width="284" height="82"/>
  <text class="node-title" x="600" y="213" text-anchor="middle">index.html → src/main.ts</text>
  <text class="node-copy" x="600" y="239" text-anchor="middle">страница запускает CSS и игру</text>

  <rect class="node entry" x="105" y="324" width="280" height="80"/>
  <text class="node-title" x="245" y="356" text-anchor="middle">src/style.css</text>
  <text class="node-copy" x="245" y="381" text-anchor="middle">внешний вид страницы и canvas</text>

  <rect class="node config" x="815" y="324" width="280" height="80"/>
  <text class="node-title" x="955" y="356" text-anchor="middle">src/game/config.ts</text>
  <text class="node-copy" x="955" y="381" text-anchor="middle">настройка Phaser и игровой баланс</text>

  <path class="arrow" d="M500 262V288H245V316"/>
  <path class="arrow" d="M700 262V288H955V316"/>

  <rect class="node scene" x="430" y="448" width="340" height="86"/>
  <text class="node-title" x="600" y="483" text-anchor="middle">src/game/GameScene.ts</text>
  <text class="node-copy" x="600" y="509" text-anchor="middle">создаёт системы и координирует игру</text>

  <path class="arrow" d="M815 364H790V491H778"/>
  <text class="caption" x="616" y="338">createGame()</text>
  <path class="arrow" d="M600 262V440"/>

  <path class="trunk" d="M600 534V554H166V574M600 554H382V574M600 554H600V574M600 554H818V574M600 554H1034V574"/>
  <path class="arrow" d="M166 554V566"/>
  <path class="arrow" d="M382 554V566"/>
  <path class="arrow" d="M600 554V566"/>
  <path class="arrow" d="M818 554V566"/>
  <path class="arrow" d="M1034 554V566"/>

  <rect class="node state" x="66" y="578" width="200" height="80"/>
  <text class="node-title" x="166" y="609" text-anchor="middle">GameState</text>
  <text class="node-copy" x="166" y="635" text-anchor="middle">счёт, фаза, таймер, режим</text>

  <rect class="node state" x="282" y="578" width="200" height="80"/>
  <text class="node-title" x="382" y="609" text-anchor="middle">GameStateMachine</text>
  <text class="node-copy" x="382" y="635" text-anchor="middle">разрешённые переходы</text>

  <rect class="node system" x="500" y="578" width="200" height="80"/>
  <text class="node-title" x="600" y="609" text-anchor="middle">Player</text>
  <text class="node-copy" x="600" y="635" text-anchor="middle">игрок, поворот, щит</text>

  <rect class="node system" x="718" y="578" width="200" height="80"/>
  <text class="node-title" x="818" y="609" text-anchor="middle">ProjectileSystem</text>
  <text class="node-copy" x="818" y="635" text-anchor="middle">снаряды и столкновения</text>

  <rect class="node system" x="934" y="578" width="200" height="80"/>
  <text class="node-title" x="1034" y="609" text-anchor="middle">GameHud</text>
  <text class="node-copy" x="1034" y="635" text-anchor="middle">счёт и сообщения</text>

  <text class="caption" x="68" y="693">GameScene координирует эти модули. Игровые значения находятся в config.ts.</text>
  <text class="caption" x="68" y="717">Примечание: config.ts регистрирует GameScene, а сцена импортирует настройки из config.ts.</text>

  <rect class="panel" x="36" y="750" width="1128" height="310" rx="22"/>
  <text class="section" x="68" y="792">2. Состояния игры</text>
  <text class="caption" x="68" y="818">Стрелки показывают переходы; причины подписаны рядом, а не поверх блоков.</text>

  <rect class="node state" x="92" y="870" width="220" height="76"/>
  <text class="node-title" x="202" y="901" text-anchor="middle">playing</text>
  <text class="node-copy" x="202" y="926" text-anchor="middle">обычная игра</text>

  <rect class="node state" x="490" y="870" width="220" height="76"/>
  <text class="node-title" x="600" y="901" text-anchor="middle">warning</text>
  <text class="node-copy" x="600" y="926" text-anchor="middle">предупреждение о фазе</text>

  <rect class="node state" x="888" y="870" width="220" height="76"/>
  <text class="node-title" x="998" y="901" text-anchor="middle">gameOver</text>
  <text class="node-copy" x="998" y="926" text-anchor="middle">конец игры</text>

  <rect class="node state" x="440" y="970" width="320" height="54"/>
  <text class="node-title" x="600" y="994" text-anchor="middle">paused</text>
  <text class="node-copy" x="600" y="1015" text-anchor="middle">P / Esc возвращает в режим до паузы</text>

  <path class="state-arrow" d="M312 892H482"/>
  <text class="caption" x="397" y="880" text-anchor="middle">достигнут порог очков</text>

  <path class="state-arrow" d="M490 928H320"/>
  <text class="caption" x="405" y="946" text-anchor="middle">таймер закончился</text>

  <path class="state-arrow" d="M710 892H880"/>
  <text class="caption" x="795" y="880" text-anchor="middle">попадание мимо щита</text>

  <path class="state-arrow" d="M202 946V960H465V962"/>
  <path class="state-arrow" d="M600 946V962"/>
  <text class="caption" x="68" y="1048">Пауза доступна в playing и warning. После gameOver пробел перезапускает сцену.</text>
</svg>
